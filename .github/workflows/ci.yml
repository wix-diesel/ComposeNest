name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  PNPM_VERSION: 11.19.0
  NODE_VERSION: 24.19.0

jobs:
  windows-root-permissions:
    name: Windows management root permissions
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - name: Test Windows host adapter
        run: cargo test -p composenest-adapters
      - name: Test management root ACL
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts\windows\Test-ManagementRoot.ps1

  linux-root-permissions:
    name: Linux management root permissions
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo bash scripts/linux/test-initialize-management-root.sh

  macos-root-permissions:
    name: macOS management root permissions
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - name: Test macOS host adapter
        run: cargo test -p composenest-adapters
      - name: Test management root permissions
        run: sudo bash scripts/macos/test-initialize-management-root.sh

  rust-fmt:
    name: Rust format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  compose-contract:
    name: Compose config and container contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - run: docker compose version
      - run: cargo test -p composenest-domain --test compose docker_config_and_container_preserve_actual_values -- --ignored

  rust-test:
    name: Rust tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - name: Install Ubuntu Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - name: Build frontend assets required by Tauri
        working-directory: apps/desktop
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  rust-clippy:
    name: Rust clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: clippy
      - name: Install Ubuntu Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - name: Build frontend assets required by Tauri
        working-directory: apps/desktop
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  frontend:
    name: Frontend typecheck and build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Check IPC contract
        run: pnpm run check:contracts
      - name: Frontend build
        run: pnpm run build
